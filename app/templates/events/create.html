{% extends "base.html" %}

{% block title %}Create Event | EventSphere{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Create New Event</h1>
        <p>Plan and schedule a new event.</p>
    </div>

    <a
        href="{{ url_for('main.events') }}"
        class="btn btn-secondary"
    >
        ← Back to Events
    </a>

</div>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for('main.create_event') }}"
    >

        <!-- EVENT NAME -->

        <div class="form-group">

            <label for="event_name">
                Event Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="event_name"
                name="event_name"
                placeholder="Enter event name"
                required
            >

        </div>


        <!-- EVENT TYPE -->

        <div class="form-group">

            <label for="event_type">
                Event Type
                <span class="required">*</span>
            </label>

            <select
                id="event_type"
                name="event_type"
                required
            >

                <option value="">
                    Select event type
                </option>

                <option value="Conference">
                    Conference
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Seminar">
                    Seminar
                </option>

                <option value="Hackathon">
                    Hackathon
                </option>

                <option value="Cultural">
                    Cultural
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Meeting">
                    Meeting
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- DATE -->

        <div class="form-row">

            <div class="form-group">

                <label for="date">
                    Event Date
                    <span class="required">*</span>
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <!-- START TIME -->

            <div class="form-group">

                <label for="start_time">
                    Start Time
                    <span class="required">*</span>
                </label>

                <input
                    type="time"
                    id="start_time"
                    name="start_time"
                    required
                >

            </div>


            <!-- END TIME -->

            <div class="form-group">

                <label for="end_time">
                    End Time
                    <span class="required">*</span>
                </label>

                <input
                    type="time"
                    id="end_time"
                    name="end_time"
                    required
                >

            </div>

        </div>


        <!-- VENUE -->

        <div class="form-group">

            <label for="venue_id">
                Venue
            </label>

            <select
                id="venue_id"
                name="venue_id"
            >

                <option value="">
                    Select a venue
                </option>

                {% if venues %}

                    {% for venue in venues %}

                        <option value="{{ venue.venue_id }}">

                            {{ venue.venue_name }}
                            —
                            Capacity: {{ venue.capacity }}
                            —
                            {{ venue.location }}

                        </option>

                    {% endfor %}

                {% else %}

                    <option value="" disabled>
                        No venues available
                    </option>

                {% endif %}

            </select>

            {% if not venues %}

                <small class="form-help">
                    No venues have been created yet.
                    <a href="{{ url_for('main.create_venue') }}">
                        Create a venue first.
                    </a>
                </small>

            {% endif %}

        </div>


        <!-- EXPECTED PARTICIPANTS -->

        <div class="form-group">

            <label for="expected_participants">
                Expected Participants
                <span class="required">*</span>
            </label>

            <input
                type="number"
                id="expected_participants"
                name="expected_participants"
                min="0"
                placeholder="e.g. 100"
                required
            >

        </div>


        <!-- BUDGET -->

        <div class="form-group">

            <label for="budget">
                Budget
            </label>

            <div class="input-prefix">

                <span>
                    ₹
                </span>

                <input
                    type="number"
                    id="budget"
                    name="budget"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                >

            </div>

        </div>


        <!-- FORM ACTIONS -->

        <div class="form-actions">

            <a
                href="{{ url_for('main.events') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Event
            </button>

        </div>

    </form>

</div>

{% endblock %}
