{% extends "base.html" %}{% block title %}Edit Attendee | EventSphere{% endblock %}{% block content %}
<div class="page-header"><div><h1>Edit Attendee</h1></div></div><form method="post" class="form-card"><div class="form-grid"><div class="form-group"><label>Name</label><input name="name" value="{{ attendee.name }}" required></div><div class="form-group"><label>Email</label><input type="email" name="email" value="{{ attendee.email }}" required></div><div class="form-group"><label>Phone</label><input name="phone" value="{{ attendee.phone or '' }}"></div><div class="form-group"><label>Organization</label><input name="organization" value="{{ attendee.organization or '' }}"></div><div class="form-group"><label>Event</label><select name="event_id"><option value="">No event</option>{% for event in events %}<option value="{{ event.event_id }}" {% if attendee.event_id == event.event_id %}selected{% endif %}>{{ event.event_name }}</option>{% endfor %}</select></div><div class="form-group"><label>Status</label><select name="status">{% for status in attendee_statuses %}<option value="{{ status }}" {% if attendee.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></div></div><div class="form-actions"><button class="btn btn-primary">Save Changes</button><a class="btn btn-secondary" href="{{ url_for('main.attendee_detail', attendee_id=attendee.attendee_id) }}">Cancel</a></div></form>{% endblock %}
