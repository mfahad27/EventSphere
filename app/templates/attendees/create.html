{% extends "base.html" %}

{% block title %}Add Attendee | EventSphere{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Add Attendee</h1>

        <p>
            Register a participant for an event.
        </p>

    </div>

</div>


<form
    method="POST"
    class="form-card"
>

    <div class="form-grid">

        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                name="name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="text"
                name="phone"
            >

        </div>


        <div class="form-group">

            <label>Organization</label>

            <input
                type="text"
                name="organization"
            >

        </div>


        <div class="form-group full">

            <label>Event</label>

            <select name="event_id">

                <option value="">
                    No event assigned
                </option>

                {% for event in events %}

                <option value="{{ event.event_id }}">
                    {{ event.event_name }}
                </option>

                {% endfor %}

            </select>

        </div>

    </div>


    <div class="form-actions">

        <button
            class="btn btn-primary"
            type="submit"
        >
            Register Attendee
        </button>

        <a
            href="{{ url_for('main.attendees') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </div>

</form>

{% endblock %}
