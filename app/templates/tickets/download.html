<!doctype html><html><head><meta charset="utf-8"><title>{{ ticket.ticket_id }} | EventSphere</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#202338}.ticket{max-width:680px;border:2px solid #635bff;border-radius:18px;padding:30px}.grid{display:flex;justify-content:space-between;gap:30px}.qr{width:180px}small{color:#667085}</style></head><body><main class="ticket"><p>EVENTSPHERE DIGITAL PASS</p><h1>{{ event.event_name }}</h1><div class="grid"><div><h2>{{ attendee.name }}</h2><p>Ticket: <strong>{{ ticket.ticket_id }}</strong></p><p>Date: {{ event.date.strftime('%d %B %Y') }}</p><p>Venue: {{ event.venue.venue_name if event.venue else 'To be announced' }}</p><small>Registration ID: {{ attendee.registration_id }}</small></div><img class="qr" src="{{ url_for('static', filename='tickets/' ~ ticket.ticket_id ~ '.png', _external=True) }}" alt="QR code"></div></main></body></html>
