{% extends "base.html" %}{% block title %}Edit Vendor | EventSphere{% endblock %}{% block content %}<div class="page-header"><div><h1>Edit {{ vendor.vendor_name }}</h1></div></div><form method="post" class="form-card"><div class="form-grid"><div class="form-group"><label>Vendor Name</label><input name="vendor_name" value="{{ vendor.vendor_name }}" required></div><div class="form-group"><label>Service Type</label><input name="service_type" value="{{ vendor.service_type }}" required></div><div class="form-group"><label>Contact Number</label><input name="contact_number" value="{{ vendor.contact_number }}" pattern="[6-9][0-9]{9}" required></div><div class="form-group"><label>Email</label><input name="email" type="email" value="{{ vendor.email }}" required></div><div class="form-group"><label>Availability</label><select name="availability">{% for item in availability_options %}<option value="{{ item }}" {% if vendor.availability == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('main.vendor_detail', vendor_id=vendor.vendor_id) }}">Cancel</a><button class="btn btn-primary">Save changes</button></div></form>{% endblock %}
