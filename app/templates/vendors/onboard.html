{% extends "base.html" %}{% block title %}Onboard Vendor | EventSphere{% endblock %}{% block content %}
<div class="page-header"><div><p class="eyebrow">VENDOR ONBOARDING</p><h1>Add a verified partner</h1><p>Verify the provider’s information before storing the vendor record.</p></div></div><form method="post" class="form-card"><div class="form-grid"><div class="form-group"><label>Vendor Name</label><input name="vendor_name" required></div><div class="form-group"><label>Service Type</label><input name="service_type" required placeholder="Catering, Photography, Sound System…"></div><div class="form-group"><label>Contact Number</label><input name="contact_number" inputmode="numeric" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" required></div><div class="form-group"><label>Email</label><input name="email" type="email" required></div><div class="form-group"><label>Availability</label><select name="availability">{% for item in availability_options %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select></div></div><label class="verification-check"><input type="checkbox" name="verified" value="yes" required> I have verified the vendor’s service and contact information.</label><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('main.vendors') }}">Cancel</a><button class="btn btn-primary">Verify & onboard vendor</button></div></form>{% endblock %}
