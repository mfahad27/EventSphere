{% extends "base.html" %}{% block title %}Add Resource | EventSphere{% endblock %}{% block content %}<div class="page-header"><div><h1>Add Resource</h1><p>Track equipment and supplies.</p></div></div><form method="post" class="form-card"><div class="form-grid"><div class="form-group"><label>Resource Name</label><input name="resource_name" required></div><div class="form-group"><label>Resource Type</label><input name="resource_type" required></div><div class="form-group"><label>Quantity</label><input type="number" name="quantity" min="0" value="1" required></div><div class="form-group"><label>Location</label><input name="location" required></div><div class="form-group"><label>Status</label><select name="status">{% for status in resource_statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Create Resource</button><a class="btn btn-secondary" href="{{ url_for('main.resources') }}">Cancel</a></div></form>{% endblock %}
