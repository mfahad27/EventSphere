{% extends "base.html" %}

{% block title %}Edit Resource | EventSphere{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Resource</h1>
    </div>

</div>


<form
    method="POST"
    class="form-card"
>

    <div class="form-grid">

        <div class="form-group">

            <label>
                Resource Name
            </label>

            <input
                type="text"
                name="resource_name"
                value="{{ resource.resource_name }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Resource Type
            </label>

            <input
                type="text"
                name="resource_type"
                value="{{ resource.resource_type }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                min="1"
                value="{{ resource.quantity }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Location
            </label>

            <input
                type="text"
                name="location"
                value="{{ resource.location or '' }}"
            >

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select name="status">

                <option
                    value="Available"
                    {% if resource.status == "Available" %}selected{% endif %}
                >
                    Available
                </option>

                <option
                    value="Unavailable"
                    {% if resource.status == "Unavailable" %}selected{% endif %}
                >
                    Unavailable
                </option>

            </select>

        </div>


        <div class="form-group full">

            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="4"
            >{{ resource.description or '' }}</textarea>

        </div>

    </div>


    <div class="form-actions">

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

        <a
            href="{{ url_for('main.resource_detail', resource_id=resource.resource_id) }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </div>

</form>

{% endblock %}
